name: Build MechOS APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mechos/**'
      - '.github/workflows/build-mechos.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: mechos
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MechOS-debug-apk
          path: mechos/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
